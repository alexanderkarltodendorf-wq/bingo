<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Spiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .cards-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .bingo-card {
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px;
            background: white;
            page-break-inside: avoid;
        }

        .bingo-card h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #667eea;
        }

        .bingo-grid {
            display: grid;
            gap: 5px;
            margin-top: 10px;
        }

        .bingo-cell {
            border: 2px solid #333;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .bingo-cell.free {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        /* Fullscreen drawing styles */
        .drawing-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            overflow: auto;
        }

        .drawing-container.active {
            display: flex;
            flex-direction: column;
        }

        .drawing-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawing-header h2 {
            color: white;
            font-size: 28px;
        }

        .exit-fullscreen {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .exit-fullscreen:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .drawing-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .current-draw {
            background: white;
            border-radius: 20px;
            padding: 60px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-width: 400px;
            text-align: center;
        }

        .current-draw h3 {
            color: #666;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .current-draw .item {
            color: #333;
            font-size: 48px;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .draw-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .draw-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .draw-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .previous-draws {
            margin-top: 40px;
            width: 100%;
            max-width: 800px;
        }

        .previous-draws h4 {
            color: white;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .draws-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .draw-item {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                padding: 20px;
            }

            .button, .button-group, .form-group {
                display: none !important;
            }

            .step {
                display: none !important;
            }

            .cards-preview {
                display: block !important;
            }

            .bingo-card {
                margin-bottom: 30px;
            }
        }

        .info-text {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Step 1: Game Definition and Card Printing -->
        <div id="step1" class="step active">
            <h1>🎯 Bingo Spiel</h1>
            <p class="subtitle">Schritt 1: Spiel definieren und Karten erstellen</p>

            <div class="info-text">
                <strong>Anleitung:</strong> Geben Sie die Begriffe ein (ein Begriff pro Zeile). 
                Das System erstellt automatisch mehrere Bingo-Karten mit zufällig verteilten Begriffen.
            </div>

            <div class="form-group">
                <label for="gridSize">Rastergröße (z.B. 5 für 5x5):</label>
                <input type="number" id="gridSize" min="3" max="7" value="5">
            </div>

            <div class="form-group">
                <label for="numCards">Anzahl der Karten:</label>
                <input type="number" id="numCards" min="1" max="20" value="6">
            </div>

            <div class="form-group">
                <label for="items">Begriffe (ein Begriff pro Zeile, mindestens so viele wie Felder auf der Karte):</label>
                <textarea id="items" placeholder="Beispiel:&#10;Kaffee&#10;Laptop&#10;Telefon&#10;Maus&#10;Tastatur&#10;..."></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="freeCenter">
                    Freies Feld in der Mitte
                </label>
            </div>

            <div class="button-group">
                <button class="button" onclick="generateCards()">Karten erstellen</button>
            </div>

            <div id="cardsPreview" class="cards-preview"></div>

            <div id="actionButtons" class="button-group" style="display: none;">
                <button class="button" onclick="printCards()">🖨️ Karten drucken</button>
                <button class="button button-secondary" onclick="startDrawing()">▶️ Ziehung starten</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Drawing Interface -->
    <div id="drawingContainer" class="drawing-container">
        <div class="drawing-header">
            <h2>🎯 Bingo Ziehung</h2>
            <button class="exit-fullscreen" onclick="exitDrawing()">✕ Beenden</button>
        </div>

        <div class="drawing-main">
            <div class="stats">
                <div class="stat-box">
                    <div class="number" id="drawnCount">0</div>
                    <div class="label">Gezogen</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="remainingCount">0</div>
                    <div class="label">Verbleibend</div>
                </div>
            </div>

            <div class="current-draw">
                <h3>Aktueller Zug:</h3>
                <div class="item" id="currentItem">---</div>
            </div>

            <button class="draw-button" id="drawButton" onclick="drawItem()">Ziehen</button>

            <div class="previous-draws">
                <h4>Bereits gezogen:</h4>
                <div class="draws-list" id="drawsList"></div>
            </div>
        </div>
    </div>

    <script>
        let gameData = {
            items: [],
            gridSize: 5,
            numCards: 6,
            freeCenter: true,
            cards: [],
            availableItems: [],
            drawnItems: []
        };

        function generateCards() {
            const gridSize = parseInt(document.getElementById('gridSize').value);
            const numCards = parseInt(document.getElementById('numCards').value);
            const itemsText = document.getElementById('items').value.trim();
            const freeCenter = document.getElementById('freeCenter').checked;

            if (!itemsText) {
                alert('Bitte geben Sie Begriffe ein!');
                return;
            }

            const items = itemsText.split('\n').map(item => item.trim()).filter(item => item.length > 0);
            const requiredItems = freeCenter ? (gridSize * gridSize - 1) : (gridSize * gridSize);

            if (items.length < requiredItems) {
                alert(`Sie benötigen mindestens ${requiredItems} Begriffe für ein ${gridSize}x${gridSize} Raster!`);
                return;
            }

            gameData.items = items;
            gameData.gridSize = gridSize;
            gameData.numCards = numCards;
            gameData.freeCenter = freeCenter;
            gameData.cards = [];

            // Generate cards
            for (let i = 0; i < numCards; i++) {
                gameData.cards.push(generateSingleCard(items, gridSize, freeCenter));
            }

            displayCards();
            document.getElementById('actionButtons').style.display = 'flex';
        }

        function generateSingleCard(items, gridSize, freeCenter) {
            const card = [];
            // Fisher-Yates shuffle for better randomization
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const cellCount = gridSize * gridSize;
            const centerIndex = Math.floor(cellCount / 2);

            let itemIndex = 0;
            for (let i = 0; i < cellCount; i++) {
                if (freeCenter && i === centerIndex && gridSize % 2 === 1) {
                    card.push({ text: 'FREI', isFree: true });
                } else {
                    card.push({ text: shuffled[itemIndex], isFree: false });
                    itemIndex++;
                }
            }

            return card;
        }

        function displayCards() {
            const preview = document.getElementById('cardsPreview');
            preview.innerHTML = '';

            gameData.cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'bingo-card';
                
                const title = document.createElement('h3');
                title.textContent = `BINGO - Karte ${index + 1}`;
                cardDiv.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'bingo-grid';
                grid.style.gridTemplateColumns = `repeat(${gameData.gridSize}, 1fr)`;

                card.forEach(cell => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'bingo-cell';
                    if (cell.isFree) {
                        cellDiv.classList.add('free');
                    }
                    cellDiv.textContent = cell.text;
                    grid.appendChild(cellDiv);
                });

                cardDiv.appendChild(grid);
                preview.appendChild(cardDiv);
            });
        }

        function printCards() {
            window.print();
        }

        function startDrawing() {
            // Initialize drawing
            gameData.availableItems = [...gameData.items];
            gameData.drawnItems = [];

            // Update UI
            document.getElementById('drawingContainer').classList.add('active');
            document.getElementById('currentItem').textContent = '---';
            document.getElementById('drawsList').innerHTML = '';
            document.getElementById('drawButton').disabled = false;
            updateStats();

            // Request fullscreen
            const elem = document.getElementById('drawingContainer');
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {
                    // Fullscreen request failed - continue anyway in normal mode
                });
            }
        }

        function exitDrawing() {
            document.getElementById('drawingContainer').classList.remove('active');
            
            // Exit fullscreen
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function drawItem() {
            if (gameData.availableItems.length === 0) {
                alert('Alle Begriffe wurden bereits gezogen!');
                document.getElementById('drawButton').disabled = true;
                return;
            }

            // Random draw
            const randomIndex = Math.floor(Math.random() * gameData.availableItems.length);
            const drawnItem = gameData.availableItems.splice(randomIndex, 1)[0];
            gameData.drawnItems.push(drawnItem);

            // Update current item
            document.getElementById('currentItem').textContent = drawnItem;

            // Add to previous draws
            const drawsList = document.getElementById('drawsList');
            const drawDiv = document.createElement('div');
            drawDiv.className = 'draw-item';
            drawDiv.textContent = drawnItem;
            drawsList.insertBefore(drawDiv, drawsList.firstChild);

            // Update stats
            updateStats();

            // Disable button if all items drawn
            if (gameData.availableItems.length === 0) {
                document.getElementById('drawButton').disabled = true;
            }
        }

        function updateStats() {
            document.getElementById('drawnCount').textContent = gameData.drawnItems.length;
            document.getElementById('remainingCount').textContent = gameData.availableItems.length;
        }

        // Handle ESC key to exit fullscreen
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && document.getElementById('drawingContainer').classList.contains('active')) {
                exitDrawing();
            }
        });
    </script>
</body>
</html>
